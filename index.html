<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft JS Optimized</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="crosshair">+</div>
        <div id="debug-info">
            <span style="color: #0f0; font-size: 24px;">FPS: <span id="fps-counter">60</span></span><br>
            <span id="debug-mode">Creative</span><br>
            XYZ: <span id="xyz-pos">0, 0, 0</span><br>
            Chunk: <span id="chunk-pos">0, 0</span><br>
            Entities: <span id="entity-count">0</span>
        </div>
        
        <div id="stats-container">
            <div id="health-bar"></div>
            <div id="food-bar"></div>
        </div>

        <div id="hotbar-container">
            <div class="hotbar-slot active" data-slot="0"></div>
            <div class="hotbar-slot" data-slot="1"></div>
            <div class="hotbar-slot" data-slot="2"></div>
            <div class="hotbar-slot" data-slot="3"></div>
            <div class="hotbar-slot" data-slot="4"></div>
            <div class="hotbar-slot" data-slot="5"></div>
            <div class="hotbar-slot" data-slot="6"></div>
            <div class="hotbar-slot" data-slot="7"></div>
            <div class="hotbar-slot" data-slot="8"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="control-row"><button class="control-btn" id="btn-fwd">▲</button></div>
            <div class="control-row">
                <button class="control-btn" id="btn-left">◀</button>
                <button class="control-btn" id="btn-back">▼</button>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
            <div class="control-row" style="margin-top:10px;">
                <button class="control-btn menu-btn" onclick="openMenuFromGame()">☰</button>
            </div>
        </div>
        <div class="action-btns">
            <div class="vertical-actions">
                <button class="control-btn action-big" id="btn-break" style="background: rgba(255, 85, 85, 0.5);">⛏️</button>
                <button class="control-btn action-big" id="btn-place" style="background: rgba(85, 255, 85, 0.5);">🧱</button>
            </div>
            <div class="jump-actions">
                <button class="control-btn" id="btn-jump">Space</button>
                <button class="control-btn" id="btn-shift">Shift</button>
            </div>
        </div>
    </div>

    <div id="menu-container">
        <div id="main-menu" class="screen active">
            <div class="logo-container">
                <h1 class="game-title">MINECRAFT</h1>
                <div class="splash-text" id="splash-text">Optimized!</div>
            </div>
            <div class="menu-buttons">
                <button class="mc-btn" onclick="showScreen('singleplayer')">Одиночная игра</button>
                <button class="mc-btn" onclick="showScreen('settings')">Настройки</button>
                <button class="mc-btn" onclick="exitGame()">Выйти</button>
            </div>
            <div class="footer-text">Beta 0.3.0 - FPS Boost</div>
        </div>

        <div id="singleplayer-screen" class="screen">
            <h2>Выбор мира</h2>
            <div class="scroll-list"></div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('create-world')">Создать Новый Мир</button>
                <button class="mc-btn" onclick="showScreen('main-menu')">Отмена</button>
            </div>
        </div>

        <div id="create-world-screen" class="screen">
            <h2>Создать Новый Мир</h2>
            <div class="create-options">
                <label>Название мира:</label>
                <input type="text" class="input-field" value="Мир">
                <label>Ключ (Seed):</label>
                <input type="text" id="seed-input" class="input-field" placeholder="Пусто = Случайно">
                <button class="mc-btn" id="btn-gamemode" onclick="cycleGameMode()">Режим: Выживание</button>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="createAndStartWorld()">Создать Мир</button>
                <button class="mc-btn" onclick="showScreen('singleplayer')">Отмена</button>
            </div>
        </div>

        <div id="settings-screen" class="screen">
            <h2>Настройки</h2>
            <div class="settings-grid">
                <button class="mc-btn" id="btn-render" onclick="toggleSetting('render')">Render Dist: 3</button>
            </div>
            <div class="bottom-buttons"><button class="mc-btn" onclick="showScreen('main-menu')">Готово</button></div>
        </div>
    </div>

    <div id="game-canvas-container"></div>
    <script src="inventory.js"></script>
    <script src="script.js"></script>
</body>
</html>

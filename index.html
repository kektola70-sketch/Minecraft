<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Mine Vertical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экраны меню (упрощены для примера) -->
    <div id="screen-auth" class="screen">
        <h1 class="title">MOBILE CRAFT</h1>
        <input type="text" id="input-nick" placeholder="Ник...">
        <button id="btn-login">ВОЙТИ</button>
    </div>

    <div id="screen-menu" class="screen" style="display:none">
        <h1 class="title">МЕНЮ</h1>
        <button onclick="initGame({seed:123})">ИГРАТЬ</button>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="ui-game" style="display:none">
        <div id="crosshair">+</div>
        <div id="joystick-container"></div>
        
        <!-- Кнопка меню сверху по центру -->
        <button onclick="location.reload()" class="btn-top-menu">МЕНЮ</button>

        <div id="action-buttons">
            <button id="btn-break" class="action-btn">ЛОМАТЬ</button>
            <button id="btn-place" class="action-btn">СТАВИТЬ</button>
        </div>

        <div id="hotbar">
            <div class="slot active" data-block="grass">
                <div class="preview grass"></div>
                <span class="count" id="count-grass">64</span>
            </div>
            <div class="slot" data-block="dirt">
                <div class="preview dirt"></div>
                <span class="count" id="count-dirt">64</span>
            </div>
            <div class="slot" data-block="stone">
                <div class="preview stone"></div>
                <span class="count" id="count-stone">64</span>
            </div>
            <div class="slot" data-block="wood">
                <div class="preview wood"></div>
                <span class="count" id="count-wood">64</span>
            </div>
            <div class="slot" data-block="leaves">
                <div class="preview leaves"></div>
                <span class="count" id="count-leaves">64</span>
            </div>
            <div class="slot btn-inv">📦</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft JS Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем пиксельный шрифт от Google -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="main-menu" class="screen active">
            <div class="logo-container">
                <h1 class="game-title">MINECRAFT</h1>
                <div class="splash-text" id="splash-text">JavaScript Edition!</div>
            </div>
            
            <div class="menu-buttons">
                <button class="mc-btn" onclick="showScreen('singleplayer')">Одиночная игра</button>
                <button class="mc-btn" onclick="showScreen('multiplayer')">Сетевая игра</button>
                
                <div class="row-buttons">
                    <button class="mc-btn half" onclick="showScreen('settings')">Настройки</button>
                    <button class="mc-btn half" onclick="showScreen('language')">Язык</button>
                </div>
                
                <button class="mc-btn" onclick="exitGame()">Выйти</button>
            </div>
            
            <div class="footer-text">Minecraft JS Edition Alpha 0.0.1<br>Copyright Mojang AB (Not really)</div>
        </div>

        <!-- ОДИНОЧНАЯ ИГРА -->
        <div id="singleplayer-screen" class="screen">
            <h2>Выбор мира</h2>
            <div class="scroll-list">
                <div class="list-item">Новый Мир (Выживание)</div>
                <div class="list-item">Тестовый Мир (Творческий)</div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="startGame()">Играть в выбранном мире</button>
                <button class="mc-btn" onclick="showScreen('main-menu')">Отмена</button>
            </div>
        </div>

        <!-- СЕТЕВАЯ ИГРА -->
        <div id="multiplayer-screen" class="screen">
            <h2>Сетевая игра</h2>
            <div class="scroll-list">
                <div class="list-item server-item">
                    <span class="server-name">Hypixel Clone</span>
                    <span class="server-ping">12ms</span>
                </div>
                <div class="list-item server-item">
                    <span class="server-name">Localhost:3000</span>
                    <span class="server-ping">0ms</span>
                </div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn">Подключиться</button>
                <button class="mc-btn" onclick="showScreen('main-menu')">Отмена</button>
            </div>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-screen" class="screen">
            <h2>Настройки</h2>
            <div class="settings-grid">
                <button class="mc-btn">Музыка: ВКЛ</button>
                <button class="mc-btn">Звуки: ВКЛ</button>
                <button class="mc-btn">Сложность: Нормально</button>
                <button class="mc-btn">FOV: 70</button>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('main-menu')">Готово</button>
            </div>
        </div>

         <!-- ЯЗЫК -->
         <div id="language-screen" class="screen">
            <h2>Язык (Language)</h2>
            <div class="scroll-list">
                <div class="list-item selected">Русский (Russia)</div>
                <div class="list-item">English (US)</div>
                <div class="list-item">Deutsch (Germany)</div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('main-menu')">Готово</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

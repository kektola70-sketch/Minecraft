<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft JS Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Подключаем Three.js для 3D графики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Подключаем библиотеку для шума Перлина (генерация ландшафта) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <!-- Слой игры (3D мир) -->
    <div id="game-world"></div>
    
    <!-- UI поверх игры (прицел) -->
    <div id="game-ui" style="display:none;">
        <div id="crosshair">+</div>
        <div id="debug-info">FPS: 60 | XYZ: 0, 0, 0</div>
    </div>

    <div id="game-container">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="main-menu" class="screen active">
            <div class="logo-container">
                <h1 class="game-title">MINECRAFT</h1>
                <div class="splash-text" id="splash-text">JavaScript Edition!</div>
            </div>
            
            <div class="menu-buttons">
                <button class="mc-btn" onclick="showScreen('singleplayer')" data-lang-key="singleplayer">Одиночная игра</button>
                <button class="mc-btn" onclick="showScreen('multiplayer')" data-lang-key="multiplayer">Сетевая игра</button>
                
                <div class="row-buttons">
                    <button class="mc-btn half" onclick="showScreen('settings')" data-lang-key="settings">Настройки</button>
                    <button class="mc-btn half" onclick="showScreen('language')" data-lang-key="language">Язык</button>
                </div>
                
                <button class="mc-btn" onclick="exitGame()" data-lang-key="quit">Выйти</button>
            </div>
            
            <div class="footer-text">Minecraft JS Edition Alpha 0.0.2</div>
        </div>

        <!-- ОДИНОЧНАЯ ИГРА -->
        <div id="singleplayer-screen" class="screen">
            <h2 data-lang-key="select_world">Выбор мира</h2>
            <div class="scroll-list">
                <div class="list-item selected">New World</div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="startGame()" data-lang-key="play_world">Играть в выбранном мире</button>
                <button class="mc-btn" onclick="showScreen('main-menu')" data-lang-key="cancel">Отмена</button>
            </div>
        </div>

        <!-- СЕТЕВАЯ ИГРА (Заглушка) -->
        <div id="multiplayer-screen" class="screen">
            <h2 data-lang-key="multiplayer">Сетевая игра</h2>
            <div class="scroll-list">
                <div class="list-item">Server 1</div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('main-menu')" data-lang-key="cancel">Отмена</button>
            </div>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-screen" class="screen">
            <h2 data-lang-key="settings">Настройки</h2>
            <div class="settings-grid">
                <button class="mc-btn" id="btn-fov" onclick="toggleSetting('fov')">FOV: 75</button>
                <button class="mc-btn" id="btn-render" onclick="toggleSetting('renderDist')">Render: 8</button>
                <button class="mc-btn" id="btn-music" onclick="toggleSetting('music')">Music: OFF</button>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="applySettings(); showScreen('main-menu')" data-lang-key="done">Готово</button>
            </div>
        </div>

         <!-- ЯЗЫК -->
         <div id="language-screen" class="screen">
            <h2 data-lang-key="language">Язык</h2>
            <div class="scroll-list">
                <div class="list-item" onclick="setLanguage('ru')">Русский (Russia)</div>
                <div class="list-item" onclick="setLanguage('en')">English (US)</div>
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('main-menu')" data-lang-key="done">Готово</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

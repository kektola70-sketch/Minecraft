<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft JS Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <!-- Библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <!-- HUD Игры -->
    <div id="game-ui">
        <div id="crosshair">+</div>
        <div id="debug-info">
            <span id="debug-mode">Creative</span> | FPS: 60<br>
            XYZ: <span id="xyz-pos">0, 0, 0</span>
        </div>
        
        <!-- Хотбар -->
        <div id="hotbar-container">
            <div class="hotbar-slot active" data-slot="0"></div>
            <div class="hotbar-slot" data-slot="1"></div>
            <div class="hotbar-slot" data-slot="2"></div>
            <div class="hotbar-slot" data-slot="3"></div>
            <div class="hotbar-slot" data-slot="4"></div>
            <div class="hotbar-slot" data-slot="5"></div>
            <div class="hotbar-slot" data-slot="6"></div>
            <div class="hotbar-slot" data-slot="7"></div>
            <div class="hotbar-slot" data-slot="8"></div>
        </div>
    </div>

    <!-- Мобильное управление -->
    <div id="mobile-controls">
        <div class="d-pad">
            <div class="control-row"><button class="control-btn" id="btn-fwd">▲</button></div>
            <div class="control-row">
                <button class="control-btn" id="btn-left">◀</button>
                <button class="control-btn" id="btn-back">▼</button>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
            <div class="control-row" style="margin-top:10px;">
                <button class="control-btn menu-btn" onclick="openMenuFromGame()">☰</button>
            </div>
        </div>
        <div class="action-btns">
            <div class="vertical-actions">
                <button class="control-btn action-big" id="btn-break" style="background: rgba(255, 85, 85, 0.5);">⛏️</button>
                <button class="control-btn action-big" id="btn-place" style="background: rgba(85, 255, 85, 0.5);">🧱</button>
            </div>
            <div class="jump-actions">
                <button class="control-btn" id="btn-jump">Space</button>
                <button class="control-btn" id="btn-shift">Shift</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div id="menu-container">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="main-menu" class="screen active">
            <div class="logo-container">
                <h1 class="game-title">MINECRAFT</h1>
                <div class="splash-text" id="splash-text">Full Update!</div>
            </div>
            <div class="menu-buttons">
                <button class="mc-btn" onclick="showScreen('singleplayer')">Одиночная игра</button>
                <button class="mc-btn" onclick="showScreen('multiplayer')">Сетевая игра</button>
                <div class="row-buttons">
                    <button class="mc-btn half" onclick="showScreen('settings')">Настройки</button>
                    <button class="mc-btn half" onclick="showScreen('language')">Язык</button>
                </div>
                <button class="mc-btn" onclick="exitGame()">Выйти</button>
            </div>
            <div class="footer-text">Alpha 0.0.8</div>
        </div>

        <!-- ОДИНОЧНАЯ ИГРА: СПИСОК -->
        <div id="singleplayer-screen" class="screen">
            <h2>Выбор мира</h2>
            <div class="scroll-list">
                <!-- Пока пусто, создаем новый -->
            </div>
            <div class="bottom-buttons">
                <button class="mc-btn" onclick="showScreen('create-world')">Создать Новый Мир</button>
                <button class="mc-btn" onclick="showScreen('main-menu')">Отмена</button>
            </div>
        </div>

        <!-- СОЗДАНИЕ МИРА (НОВОЕ) -->
        <div id="create-world-screen" class="screen">
            <h2>Создать Новый Мир</h2>
            
            <div class="create-options">
                <label>Название мира:</label>
                <input type="text" class="input-field" value="Новый Мир">
                
                <label>Ключ генерации (Seed):</label>
                <input type="text" id="seed-input" class="input-field" placeholder="Оставьте пустым для случайного">

                <button class="mc-btn" id="btn-gamemode" onclick="cycleGameMode()">Режим: Выживание</button>
                <div class="desc-text" id="gamemode-desc">Поиск ресурсов, крафт, уровни и голод.</div>
                
                <button class="mc-btn" id="btn-worldtype" onclick="cycleWorldType()">Тип мира: По умолчанию</button>

                <button class="mc-btn" onclick="alert('Настройка слоев пока недоступна в этой версии')">Настройка слоев...</button>
                <button class="mc-btn" onclick="alert('Игр��вые правила: День/Ночь - Вкл.')">Правила мира...</button>
            </div>

            <div class="bottom-buttons">
                <button class="mc-btn" onclick="createAndStartWorld()">Создать Новый Мир</button>
                <button class="mc-btn" onclick="showScreen('singleplayer')">Отмена</button>
            </div>
        </div>

        <!-- Остальные экраны (Сетевая, Настройки и т.д.) -->
        <div id="multiplayer-screen" class="screen">
            <h2>Сетевая игра</h2>
            <div class="scroll-list"><div class="list-item">Hypixel Clone (Offline)</div></div>
            <div class="bottom-buttons"><button class="mc-btn" onclick="showScreen('main-menu')">Отмена</button></div>
        </div>

        <div id="settings-screen" class="screen">
            <h2>Настройки</h2>
            <div class="settings-grid">
                <button class="mc-btn" id="btn-fov" onclick="toggleSetting('fov')">FOV: 75</button>
                <button class="mc-btn" id="btn-render" onclick="toggleSetting('render')">Render: 8</button>
            </div>
            <div class="bottom-buttons"><button class="mc-btn" onclick="showScreen('main-menu')">Готово</button></div>
        </div>

         <div id="language-screen" class="screen">
            <h2>Язык</h2>
            <div class="scroll-list">
                <div class="list-item" onclick="setLanguage('ru')">Русский</div>
                <div class="list-item" onclick="setLanguage('en')">English</div>
            </div>
            <div class="bottom-buttons"><button class="mc-btn" onclick="showScreen('main-menu')">Готово</button></div>
        </div>
    </div>

    <div id="game-canvas-container"></div>

    <script src="inventory.js"></script>
    <script src="script.js"></script>
</body>
</html>
